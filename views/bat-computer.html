<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="dashboard">
    <header class="header">
      <div class="me"></div>
      <div class="header-actions">
        <a href="/admin" class="btn-admin" id="admin-panel-btn"
          >panneau d'administration</a
        >
        <button class="logout btn-primary">se deconnecter</button>
      </div>
    </header>

    <main class="container">
      <h2>Arsenal Top Secret</h2>
      <div id="secrets"></div>

      <h2>notes de mission</h2>
      <button class="btn-primary" id="add-note-btn">
        ajouter une note de mission
      </button>
      <div id="notes"></div>

      <h2>modifier le mot de passe</h2>
      <section class="change-password-section card">
        <div class="card-body">
          <form id="change-password-form">
            <div class="form-group">
              <label for="oldPassword">Ancien mot de passe</label>
              <input type="password" id="oldPassword" class="form-control" required placeholder="••••••••" />
            </div>
            <div class="form-group">
              <label for="newPassword">Nouveau mot de passe</label>
              <input type="password" id="newPassword" class="form-control" required placeholder="••••••••" />
              <div class="password-requirements">
                Le mot de passe doit contenir au moins 12 caractères, dont une majuscule, une minuscule, un chiffre et un caractère spécial.
              </div>
            </div>
            <button type="submit" class="btn-primary btn-submit">Mettre à jour le mot de passe</button>
          </form>
          <div id="change-password-message" class="message-banner" style="display: none;"></div>
        </div>
      </section>
    </main>

    <script src="/logout.js"></script>
    <script src="/dashboard.js"></script>
    <script>
      customFetch("/api/secrets")
        .then((response) => response.json())
        .then((data) => {
          console.log("Secrets:", data);
          document.getElementById("secrets").innerHTML = `
            <div class="secrets-grid">
              ${data
                .map(
                  (secret) => `
                <div class="card">
                  <div class="card-body">
                    <h3>${secret.name}</h3>
                    <p>${secret.desc}</p>
                  </div>
                </div>
              `,
                )
                .join("")}
            </div>
          `;
        })
        .catch((error) => {
          console.error("Error fetching secrets:", error);
        });

      customFetch("/api/me")
        .then((response) => response.json())
        .then((data) => {
          document.querySelector(".me").textContent =
            `Bienvenue, Justicier, ${data.username}!`;
          if (data.role === "ADMIN") {
            document.getElementById("admin-panel-btn").style.display =
              "inline-block";
          }
        })
        .catch((error) => {
          console.error("Error fetching user info:", error);
        });

      document.querySelector(".logout").addEventListener("click", logout);

      document.getElementById("add-note-btn").addEventListener("click", () => {
        const message = prompt("entrez note de mission :");
        if (message) {
          customFetch("/api/reports", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          }).then((res) => {
            if (res.ok) {
              loadReports();
            } else {
              alert("erreur de lenregistrement de la note");
            }
          });
        }
      });

      function loadReports() {
        customFetch("/api/reports")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("notes").innerHTML = `
              <ul class="notes-list">
                ${data
                  .map(
                    (report) => `
                  <li class="note-item">
                    <strong>Mission #${report.id} - rapporté par ${report.username}:</strong> 
                    <p class="note-message">${report.message}</p>
                  </li>
                `,
                  )
                  .join("")}
              </ul>
            `;
          })
          .catch((error) => console.error("error fetching reports:", error));
      }

      loadReports();

      document.getElementById("change-password-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const msgDiv = document.getElementById("change-password-message");

        // clear prev state
        msgDiv.style.display = "block";
        msgDiv.className = "message-banner info";
        msgDiv.textContent = "Modification en cours...";

        customFetch("/api/auth/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ oldPassword, newPassword }),
        })
          .then(async (res) => {
            const data = await res.json();
            if (res.ok) {
              msgDiv.className = "message-banner success";
              msgDiv.textContent = data.message || "Mot de passe mis à jour avec succès !";
              document.getElementById("change-password-form").reset();
            } else {
              msgDiv.className = "message-banner error";
              msgDiv.textContent = data.error || "Une erreur est survenue.";
            }
          })
          .catch((error) => {
            console.error("Error changing password:", error);
            msgDiv.className = "message-banner error";
            msgDiv.textContent = "Erreur de connexion avec le serveur.";
          });
      });
    </script>
  </body>
</html>
